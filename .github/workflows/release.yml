name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.5.1
        required: true

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Sources: the tag being released (full history for the changelog).
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          path: src
      # Release configuration and LICENSE: the ref this workflow runs from.
      # Kept outside src so older tags (without them) still build clean.
      - uses: actions/checkout@v7.0.1
        with:
          path: cfg
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          workdir: src
          args: release --clean --config ../cfg/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_DIR: ../cfg
