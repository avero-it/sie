name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.5.1
        required: true
      runner:
        description: Where the Linux jobs run (hosted = GitHub's runners, e.g. to redo a failed release)
        type: choice
        options: [auto, hosted]
        default: auto

permissions:
  contents: write # create the GitHub release and upload assets

jobs:
  pick:
    uses: ./.github/workflows/pick-runner.yml
    with:
      force_hosted: ${{ inputs.runner == 'hosted' }}

  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [pick, ci]
    runs-on: ${{ fromJSON(needs.pick.outputs.linux) }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Sources: the tag being released (full history for the changelog).
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          path: src
      # Release configuration and LICENSE: the ref this workflow runs from.
      # Kept outside src so older tags (without them) still build clean.
      - uses: actions/checkout@v7.0.1
        with:
          path: cfg
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: src/go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          workdir: src
          args: release --clean --config ${{ github.workspace }}/cfg/.goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (Contents read/write on avero-it/homebrew-tap and
          # avero-it/scoop-bucket). Empty if unset: those uploads are skipped.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # Absolute: GoReleaser cannot archive files given by a relative "../" path.
          LICENSE_DIR: ${{ github.workspace }}/cfg
