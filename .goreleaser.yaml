# GoReleaser config for sie: six static (cgo-free) binaries, archives,
# checksums and the GitHub release. Run by .github/workflows/release.yml.
# Local dry run: goreleaser release --snapshot --clean
version: 2

project_name: sie

builds:
  - id: sie
    main: ./cmd/sie
    binary: sie
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X github.com/avero-it/sie/internal/buildinfo.version={{ .Tag }}
      - -X github.com/avero-it/sie/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/avero-it/sie/internal/buildinfo.date={{ .Date }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible file times

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      # LICENSE_DIR lets the release workflow take LICENSE from the current
      # config checkout when releasing an older tag that has none.
      - src: '{{ envOrDefault "LICENSE_DIR" "." }}/LICENSE'
        dst: LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  header: |
    Static binaries for Linux, macOS and Windows (amd64 and arm64), no
    dependencies. Download the archive for your platform, or:

        go install github.com/avero-it/sie/cmd/sie@{{ .Tag }}

# Package managers. The tap and bucket repos are written with the
# TAP_GITHUB_TOKEN secret (a fine-grained PAT, Contents read/write on both
# repos); without it the uploads are skipped and the release still succeeds.
homebrew_casks:
  - name: sie
    repository:
      owner: avero-it
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/avero-it/sie
    description: "siMPLE eDITOR: a modeless terminal text editor"
    license: MIT
    binaries: [sie]
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    hooks:
      post:
        # The binaries are not signed: clear the quarantine flag so macOS
        # lets sie run without a Gatekeeper prompt.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/sie"]
          end

scoops:
  - name: sie
    repository:
      owner: avero-it
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/avero-it/sie
    description: "siMPLE eDITOR: a modeless terminal text editor"
    license: MIT
    skip_upload: '{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'

nfpms:
  - package_name: sie
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Simone Baglioni
    homepage: https://github.com/avero-it/sie
    maintainer: Simone Baglioni <github@simonebaglioni.com>
    description: "siMPLE eDITOR: a modeless terminal text editor"
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: '{{ envOrDefault "LICENSE_DIR" "." }}/LICENSE'
        dst: /usr/share/licenses/sie/LICENSE
